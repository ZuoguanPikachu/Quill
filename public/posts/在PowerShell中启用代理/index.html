<article class="post page">
  <header class="post-header">
    
    <div class="post-meta">
      <time datetime="2024-11-11">2024-11-11</time>
      <span class="sep">·</span> <a class="cat" href="/categories/%E8%AE%A1%E7%AE%97%E6%9C%BA/">计算机</a>
    </div>
    <div class="post-tags"><a class="tag" href="/tags/%E4%BB%A3%E7%90%86/">代理</a><a class="tag" href="/tags/Powershell/">Powershell</a></div>
  </header>
  <div class="post-content">
<p>在<code>$PROFILE</code>中添加如下代码：</p>
<figure class="code-block" data-lang="powershell">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">powershell</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span><span class="line-no">2</span><span class="line-no">3</span><span class="line-no">4</span><span class="line-no">5</span><span class="line-no">6</span><span class="line-no">7</span><span class="line-no">8</span><span class="line-no">9</span><span class="line-no">10</span></div>
    <pre class="code-scroll"><code class="language-powershell"><span class="line"><span class="token keyword">function</span> <span class="token function">Enable-Proxy</span> <span class="token punctuation">{</span></span><span class="line">    <span class="token variable">$internet_setting</span> = <span class="token function">Get-ItemProperty</span> <span class="token operator">-</span>Path <span class="token string">'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'</span></span><span class="line">    <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token variable">$internet_setting</span><span class="token punctuation">.</span>ProxyEnable <span class="token operator">-eq</span> 1<span class="token punctuation">)</span> <span class="token punctuation">{</span></span><span class="line">        <span class="token variable">$env</span>:HTTP_PROXY = <span class="token string">"http://<span class="token function">$<span class="token punctuation">(</span><span class="token variable">$internet_setting</span><span class="token punctuation">.</span>ProxyServer<span class="token punctuation">)</span></span>"</span></span><span class="line">        <span class="token variable">$env</span>:HTTPS_PROXY = <span class="token string">"http://<span class="token function">$<span class="token punctuation">(</span><span class="token variable">$internet_setting</span><span class="token punctuation">.</span>ProxyServer<span class="token punctuation">)</span></span>"</span></span><span class="line">    <span class="token punctuation">}</span></span><span class="line">    <span class="token function">Remove-Variable</span> <span class="token operator">-</span>Name internet_setting</span><span class="line"><span class="token punctuation">}</span></span><span class="line"> </span><span class="line"><span class="token function">Enable-Proxy</span></span></code></pre>
  </div>
</figure><p>启动终端时，如果代理已开启，则会在PowerShell中启用代理。</p>
<p>如果启动时未开启，可在开启后执行以下命令</p>
<figure class="code-block" data-lang="powershell">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">powershell</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span></div>
    <pre class="code-scroll"><code class="language-powershell"><span class="line"><span class="token function">Enable-Proxy</span></span></code></pre>
  </div>
</figure>
