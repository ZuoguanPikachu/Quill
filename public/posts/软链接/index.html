      <time datetime="2024-08-21">2024-08-21</time>

  <div class="post-content">
<p>第一次了解到软链接，是在这个视频：<a href="https://www.bilibili.com/video/BV1Ct411P7ma/" target="_blank" rel="noopener noreferrer">黑科技？你不知道的一种快捷方式，没有空间占用。在这种快捷方式面前，普通的快捷方式都是弟弟</a>。</p>
<p>最近，电脑的C盘又红了，就想着把一些大文件移到D盘，然后再用软链接映射回C盘原本的位置。但是PowerShell里没有mklink这个命令，需要用<code>New-Item</code>，遂记录一下。</p>
<p>现在我将<code>C:\Users\zuoguan\.nuget</code>剪切至<code>D:\.nuget</code></p>
<p>创建软链接：</p>
<figure class="code-block" data-lang="powershell">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">powershell</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span></div>
    <pre class="code-scroll"><code class="language-powershell"><span class="line"><span class="token function">New-Item</span> <span class="token operator">-</span>ItemType SymbolicLink <span class="token operator">-</span>Path <span class="token string">"C:\Users\zuoguan\.nuget"</span> <span class="token operator">-</span>Target <span class="token string">"D:\.nuget"</span></span></code></pre>
  </div>
</figure>
