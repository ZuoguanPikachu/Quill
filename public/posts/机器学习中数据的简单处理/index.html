    <div class="post-meta">
      <time datetime="2023-04-13">2023-04-13</time>
      <span class="sep">·</span> <a class="cat" href="/categories/%E7%BC%96%E7%A8%8B/">编程</a>
    </div>
    <div class="post-tags"><a class="tag" href="/tags/%E6%95%B0%E6%8D%AE%E5%A4%84%E7%90%86/">数据处理</a><a class="tag" href="/tags/Python/">Python</a></div>

  <div class="post-content">
<p><code>Kaggle</code>机器学习比赛的数据集中会有一些缺失值和一些离散值，分享一下使用pandas快速处理的方法。</p>
<p>首先将训练集和测试集合并（在后续步骤中训练集与测试集一起算均值、方差，属于比赛中的小技巧）</p>
<figure class="code-block" data-lang="python">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">python</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span><span class="line-no">2</span><span class="line-no">3</span></div>
    <pre class="code-scroll"><code class="language-python"><span class="line">train <span class="token operator">=</span> pandas<span class="token punctuation">.</span>read_csv<span class="token punctuation">(</span><span class="token string">"train.csv"</span><span class="token punctuation">)</span></span><span class="line">test <span class="token operator">=</span> pandas<span class="token punctuation">.</span>read_csv<span class="token punctuation">(</span><span class="token string">"test.csv"</span><span class="token punctuation">)</span></span><span class="line">all_features <span class="token operator">=</span> pandas<span class="token punctuation">.</span>concat<span class="token punctuation">(</span><span class="token punctuation">(</span>train<span class="token punctuation">.</span>iloc<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">:</span><span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">,</span> test<span class="token punctuation">.</span>iloc<span class="token punctuation">[</span><span class="token punctuation">:</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">:</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span></span></code></pre>
  </div>
</figure><p>将数值型特征重新缩放到零均值和单位方差来标准化数据，缺失值替换为0，即均值</p>
<figure class="code-block" data-lang="python">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">python</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span><span class="line-no">2</span><span class="line-no">3</span><span class="line-no">4</span><span class="line-no">5</span></div>
    <pre class="code-scroll"><code class="language-python"><span class="line">numeric_features <span class="token operator">=</span> all_features<span class="token punctuation">.</span>dtypes<span class="token punctuation">[</span>all_features<span class="token punctuation">.</span>dtypes <span class="token operator">!=</span> <span class="token string">"object"</span><span class="token punctuation">]</span><span class="token punctuation">.</span>index</span><span class="line">all_features<span class="token punctuation">[</span>numeric_features<span class="token punctuation">]</span> <span class="token operator">=</span> all_features<span class="token punctuation">[</span>numeric_features<span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token builtin">apply</span><span class="token punctuation">(</span></span><span class="line">    <span class="token keyword">lambda</span> x<span class="token punctuation">:</span> <span class="token punctuation">(</span>x <span class="token operator">-</span> x<span class="token punctuation">.</span>mean<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token operator">/</span> x<span class="token punctuation">.</span>std<span class="token punctuation">(</span><span class="token punctuation">)</span></span><span class="line"><span class="token punctuation">)</span></span><span class="line">all_features<span class="token punctuation">[</span>numeric_features<span class="token punctuation">]</span> <span class="token operator">=</span> all_features<span class="token punctuation">[</span>numeric_features<span class="token punctuation">]</span><span class="token punctuation">.</span>fillna<span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span></span></code></pre>
  </div>
</figure><p>对离散数值采用one-hot编码处理</p>
<figure class="code-block" data-lang="python">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">python</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span></div>
    <pre class="code-scroll"><code class="language-python"><span class="line">all_features <span class="token operator">=</span> pandas<span class="token punctuation">.</span>get_dummies<span class="token punctuation">(</span>all_features<span class="token punctuation">,</span> dummy_na<span class="token operator">=</span><span class="token boolean">True</span><span class="token punctuation">)</span></span></code></pre>
  </div>
</figure><p>处理完后，再重新分为训练集和测试集</p>
<figure class="code-block" data-lang="python">
  <figcaption class="code-header">
    <span class="code-dots"><i class="code-dot red"></i><i class="code-dot yellow"></i><i class="code-dot green"></i></span>
    <span class="code-lang">python</span>
    <button type="button" class="code-copy" data-code-copy>复制</button>
  </figcaption>
  <div class="code-body">
    <div class="code-gutter" aria-hidden="true"><span class="line-no">1</span><span class="line-no">2</span><span class="line-no">3</span></div>
    <pre class="code-scroll"><code class="language-python"><span class="line">n_train <span class="token operator">=</span> train<span class="token punctuation">.</span>shape<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span></span><span class="line">train_features <span class="token operator">=</span> torch<span class="token punctuation">.</span>tensor<span class="token punctuation">(</span>all_features<span class="token punctuation">[</span><span class="token punctuation">:</span>n_train<span class="token punctuation">]</span><span class="token punctuation">.</span>values<span class="token punctuation">.</span>astype<span class="token punctuation">(</span>numpy<span class="token punctuation">.</span>float32<span class="token punctuation">)</span><span class="token punctuation">,</span> dtype<span class="token operator">=</span>torch<span class="token punctuation">.</span>float32<span class="token punctuation">)</span></span><span class="line">test_features <span class="token operator">=</span> torch<span class="token punctuation">.</span>tensor<span class="token punctuation">(</span>all_features<span class="token punctuation">[</span>n_train<span class="token punctuation">:</span><span class="token punctuation">]</span><span class="token punctuation">.</span>values<span class="token punctuation">.</span>astype<span class="token punctuation">(</span>numpy<span class="token punctuation">.</span>float32<span class="token punctuation">)</span><span class="token punctuation">,</span> dtype<span class="token operator">=</span>torch<span class="token punctuation">.</span>float32<span class="token punctuation">)</span></span></code></pre>
  </div>
</figure>
